services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: libratrack
      POSTGRES_PASSWORD: libratrack
      POSTGRES_DB: libratrack
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U libratrack -d libratrack"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://libratrack:libratrack@postgres:5432/libratrack?sslmode=disable
      MIGRATIONS_PATH: /app/migrations
      JWT_SECRET: docker-compose-dev-secret
      PORT: "8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
