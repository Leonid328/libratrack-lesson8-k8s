# Demo app 2 (presentation): whoami behind a Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-whoami
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-whoami
  template:
    metadata:
      labels:
        app: demo-whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.3
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: demo-whoami
  namespace: default
spec:
  type: NodePort
  selector:
    app: demo-whoami
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30082
